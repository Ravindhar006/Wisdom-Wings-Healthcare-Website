<div id="course-modal" class="modal-overlay hidden" aria-hidden="true">
  <div class="modal-backdrop"></div>
  <div class="modal-container fade-up">
    <button class="modal-close-btn" aria-label="Close modal">
      <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"
        stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>

    <div class="modal-content">
      <div class="modal-header">
        <span class="course-badge" id="modal-category">Category</span>
        <h2 class="modal-title" id="modal-title">Course Title</h2>
      </div>

      <div class="modal-meta">
        <div class="meta-item">
          <span class="meta-icon">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="16" y1="2" x2="16" y2="6"></line>
              <line x1="8" y1="2" x2="8" y2="6"></line>
              <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
          </span>
          <span id="modal-duration">8 Weeks</span>
        </div>
        <div class="meta-item">
          <span class="meta-icon">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="2" y1="12" x2="22" y2="12"></line>
              <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z">
              </path>
            </svg>
          </span>
          <span id="modal-mode">Online / Offline</span>
        </div>
      </div>

      <div class="modal-body">
        <h3>About This Program</h3>
        <p id="modal-desc" class="modal-desc">Description goes here.</p>

        <h3>Curriculum Modules</h3>
        <ul id="modal-topics" class="course-topics-list">
          <!-- Topics injected via JS -->
        </ul>
      </div>

      <div class="modal-footer">
        <!-- Re-use the existing cta button logic -->
        <a href="index.html#contact" id="modal-enroll-btn" class="btn btn-navy"
          style="width: 100%; text-align: center; justify-content: center;">Enroll Now</a>
      </div>
    </div>
  </div>
</div>
