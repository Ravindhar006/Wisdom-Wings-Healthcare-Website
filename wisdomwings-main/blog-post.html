<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Blog Post - Wisdom Wings Healthcare</title>
    <link rel="icon" type="image/png" href="./images/wisdomlogo.png">
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet">
    
    <!-- CSS -->
    <link rel="stylesheet" href="./css/styles.css?v=4">
    <link rel="stylesheet" href="./css/header.css?v=3">
    <link rel="stylesheet" href="./css/blog.css?v=1">
    <link rel="stylesheet" href="./css/footer.css?v=1">
</head>

<body>
    <!-- Target for header component -->
    <div id="header-root"></div>

    <main style="padding-top: 100px; padding-bottom: 80px; background: #fafafa;">
        <div class="container">
            <a href="blog.html" class="back-link">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                Back to all blogs
            </a>
            
            <article id="blog-post-article" class="blog-article-card fade-up">
                <!-- Loading Skeleton -->
                <div class="skeleton" style="width: 100%; height: 400px; border-radius: 20px 20px 0 0;"></div>
                <div style="padding: 40px;">
                    <div class="skeleton" style="width: 30%; height: 16px; margin-bottom: 24px;"></div>
                    <div class="skeleton" style="width: 80%; height: 40px; margin-bottom: 24px;"></div>
                    <div class="skeleton" style="width: 100%; height: 16px; margin-bottom: 12px;"></div>
                    <div class="skeleton" style="width: 100%; height: 16px; margin-bottom: 12px;"></div>
                    <div class="skeleton" style="width: 90%; height: 16px; margin-bottom: 12px;"></div>
                    <div class="skeleton" style="width: 100%; height: 16px; margin-bottom: 12px;"></div>
                    <div class="skeleton" style="width: 70%; height: 16px; margin-bottom: 12px;"></div>
                </div>
            </article>

            <!-- Error state -->
            <div id="blog-not-found" style="display: none; text-align: center; padding: 100px 0;">
                <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="var(--secondary)" stroke-width="2" style="margin-bottom: 20px;">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="8" x2="12" y2="12"></line>
                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                </svg>
                <h2 style="font-family: 'Space Grotesk', sans-serif; font-size: 2rem; color: var(--primary); margin-bottom: 16px;">Blog post not found</h2>
                <p style="color: #64748b; margin-bottom: 24px;">The article you are looking for does not exist or has been removed.</p>
                <a href="blog.html" class="btn" style="background: var(--primary); color: white; padding: 12px 24px; border-radius: 30px; text-decoration: none; font-weight: 600;">Return to Blog</a>
            </div>
        </div>
    </main>

    <!-- Target for footer component -->
    <div id="footer-root"></div>

    <!-- Scripts -->
    <script src="./js/main.js?v=15"></script>
</body>
</html>
